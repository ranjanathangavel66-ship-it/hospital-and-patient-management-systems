<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital and Patient Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7fb;
            color: #333;
        }

        /* Header */
        header {
            background-color: #1976d2;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        /* Main Container */
        .container {
            width: 95%;
            max-width: 1300px;
            margin: 30px auto;
        }

        /* Dashboard */
        .dashboard {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            background-color: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .card h2 {
            font-size: 32px;
            color: #1976d2;
            margin-bottom: 8px;
        }

        /* Form Section */
        .form-section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
            margin-bottom: 30px;
        }

        .form-section h2,
        .search-section h2 {
            color: #1976d2;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1976d2;
        }

        /* Buttons */
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 20px;
        }

        .add-btn {
            background-color: #1976d2;
            color: white;
        }

        .add-btn:hover {
            background-color: #125ca1;
        }

        .clear-btn {
            background-color: #777;
            color: white;
            margin-left: 10px;
        }

        .clear-btn:hover {
            background-color: #555;
        }

        .edit-btn {
            background-color: #ff9800;
            color: white;
            padding: 8px 12px;
            margin: 0 5px 0 0;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
            padding: 8px 12px;
            margin: 0;
        }

        /* Search Section */
        .search-section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            max-width: 500px;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px #ccc;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background-color: #1976d2;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e8f1fb;
        }

        /* Message */
        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {

            .dashboard {
                flex-direction: column;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 22px;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Hospital and Patient Management System</h1>
        <p>CRUD-Based Web Application</p>
    </header>


    <div class="container">

        <!-- Dashboard -->
        <div class="dashboard">

            <div class="card">
                <h2 id="totalPatients">0</h2>
                <p>Total Patients</p>
            </div>

            <div class="card">
                <h2 id="malePatients">0</h2>
                <p>Male Patients</p>
            </div>

            <div class="card">
                <h2 id="femalePatients">0</h2>
                <p>Female Patients</p>
            </div>

        </div>


        <!-- Patient Form -->
        <div class="form-section">

            <h2>Add / Update Patient</h2>

            <form id="patientForm">

                <!-- Hidden ID for Update -->
                <input type="hidden" id="patientId">

                <div class="form-grid">

                    <div>
                        <label for="name">Patient Name</label>
                        <input type="text" id="name" placeholder="Enter patient name" required>
                    </div>

                    <div>
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="Enter age" min="1" max="120" required>
                    </div>

                    <div>
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter phone number" required>
                    </div>

                    <div>
                        <label for="department">Department</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option value="Cardiology">Cardiology</option>
                            <option value="Neurology">Neurology</option>
                            <option value="Orthopedics">Orthopedics</option>
                            <option value="General Medicine">General Medicine</option>
                            <option value="Pediatrics">Pediatrics</option>
                            <option value="Dermatology">Dermatology</option>
                        </select>
                    </div>

                    <div>
                        <label for="doctor">Doctor Name</label>
                        <input type="text" id="doctor" placeholder="Enter doctor name" required>
                    </div>

                    <div>
                        <label for="date">Admission Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <div>
                        <label for="condition">Medical Condition</label>
                        <input type="text" id="condition" placeholder="Enter medical condition" required>
                    </div>

                </div>

                <button type="submit" class="add-btn" id="submitBtn">
                    Add Patient
                </button>

                <button type="button" class="clear-btn" onclick="clearForm()">
                    Clear
                </button>

                <p id="message"></p>

            </form>

        </div>


        <!-- Search Section -->
        <div class="search-section">

            <h2>Search Patients</h2>

            <input type="text"
                   id="searchInput"
                   placeholder="Search by patient name, department, or doctor..."
                   onkeyup="displayPatients()">

        </div>


        <!-- Patient Records -->
        <h2 style="margin-bottom: 15px; color: #1976d2;">
            Patient Records
        </h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Patient Name</th>
                        <th>Age</th>
                        <th>Gender</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Doctor</th>
                        <th>Admission Date</th>
                        <th>Medical Condition</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="patientTableBody">
                </tbody>

            </table>

        </div>

    </div>
